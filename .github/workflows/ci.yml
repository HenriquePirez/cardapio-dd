name: CI

# Sem branch protection: o workflow roda em PR e em push para main (sem ele,
# commits diretos em main nunca teriam feedback). Ver docs/quality.md.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:typed
      - run: npm run check
      - run: npm run test
      - run: npm run build
